name: CI

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-22.04
        timeout-minutes: 20
        env:
            REPO: ${{ vars.DOCKERHUB_USERNAME }}/maven-hello-world

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  filter: tree:0

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: "17"
                  distribution: "temurin"

            - name: Determine next version
              id: version
              working-directory: myapp
              run: |
                  CURRENT=$(mvn -B -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)

                  [[ "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
                  echo "::error::unexpected version format: '$CURRENT' (expected X.Y.Z)"
                  exit 1; }

                  MAJOR=$(echo "$CURRENT" | cut -d. -f1)
                  MINOR=$(echo "$CURRENT" | cut -d. -f2)

                  LAST=$(git tag -l "v$MAJOR.$MINOR.*" --sort=-v:refname | head -n1)
                  if [ -z "$LAST" ]; then
                    NEW="$MAJOR.$MINOR.0"
                    OLD="none"
                  else
                    PATCH=$(echo "$LAST" | cut -d. -f3)
                    NEW="$MAJOR.$MINOR.$((PATCH + 1))"
                    OLD="${LAST#v}"
                  fi

                  echo "new=$NEW" >> "$GITHUB_OUTPUT"
                  echo "Version bump: $OLD -> $NEW"

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  load: true
                  push: false
                  build-args: |
                      APP_VER=${{ steps.version.outputs.new }}
                  tags: |
                      ${{ env.REPO }}:${{ steps.version.outputs.new }}
                      ${{ env.REPO }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Smoke test
              env:
                  IMAGE: ${{ env.REPO }}:${{ steps.version.outputs.new }}
              run: |
                  echo "--- entrypoint check ---"
                  docker run --rm "$IMAGE"

                  echo "--- non-root check ---"
                  RUN_UID=$(docker run --rm --entrypoint id "$IMAGE" -u)
                  echo "Running as UID: $RUN_UID"
                  [ "$RUN_UID" != "0" ] || {
                    echo "::error::container runs as root"; exit 1; }

            - name: Extract jar from image
              env:
                  IMAGE: ${{ env.REPO }}:${{ steps.version.outputs.new }}
                  JAR: myapp-${{ steps.version.outputs.new }}.jar
              run: |
                  CID=$(docker create "$IMAGE")
                  docker cp "$CID:/app/app.jar" "./$JAR"
                  docker rm "$CID"
                  ls -lh "./$JAR"

            - name: Upload jar artifact
              uses: actions/upload-artifact@v4
              with:
                  name: myapp-${{ steps.version.outputs.new }}
                  path: ./myapp-${{ steps.version.outputs.new }}.jar
                  if-no-files-found: error
                  retention-days: 14

            - name: Push to DockerHub
              env:
                  VERSION: ${{ steps.version.outputs.new }}
              run: |
                  docker push "$REPO:$VERSION"
                  docker push "$REPO:latest"

            - name: Pull from DockerHub
              env:
                  VERSION: ${{ steps.version.outputs.new }}
              run: |
                  docker rmi "$REPO:$VERSION" "$REPO:latest"
                  docker pull "$REPO:$VERSION"
                  OUTPUT=$(docker run --rm "$REPO:$VERSION")
                  echo "$OUTPUT"

            - name: Tag the release
              env:
                  VERSION: ${{ steps.version.outputs.new }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git tag "v$VERSION"
                  git push origin "v$VERSION"
