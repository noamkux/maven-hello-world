name: PR

on:
    pull_request:
        branches: [main]

permissions: {}

concurrency:
    group: pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    pr-check:
        runs-on: ubuntu-22.04
        timeout-minutes: 15
        permissions:
            contents: read
        env:
            IMAGE: maven-hello-world:pr

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Lint chart
              run: helm lint chart/

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  load: true
                  push: false
                  build-args: |
                      APP_VER=0.0.0-pr
                  tags: ${{ env.IMAGE }}
                  cache-from: type=gha

            - name: Smoke test
              run: |
                  echo "--- entrypoint check ---"
                  docker run --rm "$IMAGE"

                  echo "--- non-root check ---"
                  RUN_UID=$(docker run --rm --entrypoint id "$IMAGE" -u)
                  echo "Running as UID: $RUN_UID"
                  [ "$RUN_UID" != "0" ] || {
                    echo "::error::container runs as root"; exit 1; }

            - name: Create kind cluster
              uses: helm/kind-action@v1
              with:
                  cluster_name: pr

            - name: Deploy with Helm
              run: |
                  kind load docker-image "$IMAGE" --name pr

                  helm install hello chart/ \
                    --set image.repository=maven-hello-world \
                    --set image.tag=pr \
                    --wait --wait-for-jobs --timeout 3m

                  kubectl logs job/hello
