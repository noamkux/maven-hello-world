name: CI

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Determine next version
              id: version
              run: |
                  LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
                  CURRENT=${LATEST#v}
                  MAJOR=$(echo "$CURRENT" | cut -d. -f1)
                  MINOR=$(echo "$CURRENT" | cut -d. -f2)
                  PATCH=$(echo "$CURRENT" | cut -d. -f3)
                  NEW="$MAJOR.$MINOR.$((PATCH + 1))"
                  echo "version=$NEW" >> "$GITHUB_OUTPUT"
                  echo "Latest tag: $LATEST -> new version: $NEW"

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  load: true
                  push: false
                  build-args: |
                      REVISION=${{ steps.version.outputs.version }}
                  tags: |
                      ${{ vars.DOCKERHUB_USERNAME }}/maven-hello-world:${{ steps.version.outputs.version }}
                      ${{ vars.DOCKERHUB_USERNAME }}/maven-hello-world:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Smoke test
              run: |
                  IMAGE="${{ vars.DOCKERHUB_USERNAME }}/maven-hello-world:${{ steps.version.outputs.version }}"
                    
                  echo "--- entrypoint check ---"
                  docker run --rm "$IMAGE"

                  echo "--- non-root check ---"
                  RUN_UID=$(docker run --rm --entrypoint id "$IMAGE" -u)
                  echo "Running as UID: $RUN_UID"
                  [ "$RUN_UID" != "0" ] || {
                    echo "::error::container runs as root"; exit 1; }

            - name: Extract jar from image
              run: |
                  IMAGE="${{ vars.DOCKERHUB_USERNAME }}/maven-hello-world:${{ steps.version.outputs.version }}"
                  CID=$(docker create "$IMAGE")
                  docker cp "$CID:/app/app.jar" "./myapp-${{ steps.version.outputs.version }}.jar"
                  docker rm "$CID"
                  ls -lh ./myapp-*.jar

              id: run
              run: |
                  IMAGE="${{ vars.DOCKERHUB_USERNAME }}/maven-hello-world:${{ steps.version.outputs.version }}"
                  docker rmi "$IMAGE" || true
                  docker pull "$IMAGE"
                  OUTPUT=$(docker run --rm "$IMAGE")
                  echo "$OUTPUT"
                  echo "output=$OUTPUT" >> "$GITHUB_OUTPUT"
