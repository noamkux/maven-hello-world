name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Publish to the scratch repo and skip tagging"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.new }}
    env:
      REPO: ${{ vars.DOCKERHUB_USERNAME }}/maven-hello-world${{ inputs.dry_run && '-ci' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Lint chart
        run: helm lint chart/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Determine next version
        id: version
        working-directory: myapp
        run: |
          CURRENT=$(mvn -B -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)

          [[ "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::unexpected version format: '$CURRENT' (expected X.Y.Z)"
            exit 1; }

          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          LAST=$(git tag -l "v$MAJOR.$MINOR.*" --sort=-v:refname | head -n1)

          if [ -z "$LAST" ]; then
            PATCH=0
            OLD="none"
          else
            PATCH=$(( $(echo "$LAST" | cut -d. -f3) + 1 ))
            OLD="${LAST#v}"
          fi

          NEW="$MAJOR.$MINOR.$PATCH"

          git rev-parse "v$NEW" >/dev/null 2>&1 && {
            echo "::error::v$NEW already exists in git — version computation is broken"
            exit 1; }

          for _ in $(seq 1 20); do
            docker manifest inspect "$REPO:$NEW" >/dev/null 2>&1 || break
            echo "::warning::$REPO:$NEW is already published but has no git tag — skipping"
            PATCH=$((PATCH + 1))
            NEW="$MAJOR.$MINOR.$PATCH"
          done

          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "Version bump: $OLD -> $NEW"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          build-args: |
            APP_VER=${{ steps.version.outputs.new }}
          tags: |
            ${{ env.REPO }}:${{ steps.version.outputs.new }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        env:
          IMAGE: ${{ env.REPO }}:${{ steps.version.outputs.new }}
        run: |
          echo "--- entrypoint check ---"
          docker run --rm "$IMAGE"

          echo "--- non-root check ---"
          RUN_UID=$(docker run --rm --entrypoint id "$IMAGE" -u)
          echo "Running as UID: $RUN_UID"
          [ "$RUN_UID" != "0" ] || {
            echo "::error::container runs as root"; exit 1; }

      - name: Extract jar from image
        env:
          IMAGE: ${{ env.REPO }}:${{ steps.version.outputs.new }}
          JAR: myapp-${{ steps.version.outputs.new }}.jar
        run: |
          CID=$(docker create "$IMAGE")
          docker cp "$CID:/app/app.jar" "./$JAR"
          docker rm "$CID"
          ls -lh "./$JAR"

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp-${{ steps.version.outputs.new }}
          path: ./myapp-${{ steps.version.outputs.new }}.jar
          if-no-files-found: error
          retention-days: 14

      - name: Push to DockerHub
        env:
          VERSION: ${{ steps.version.outputs.new }}
        run: |
          docker push "$REPO:$VERSION"

      - name: Pull from DockerHub
        env:
          VERSION: ${{ steps.version.outputs.new }}
        run: |
          docker rmi "$REPO:$VERSION"
          docker pull "$REPO:$VERSION"
          docker run --rm "$REPO:$VERSION"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci

      - name: Deploy with Helm
        env:
          VERSION: ${{ steps.version.outputs.new }}
        run: |
          RENDERED=$(helm template hello chart/ \
            --set image.repository="$REPO" \
            --set image.tag="$VERSION" \
            | grep -oP '^\s*image:\s*"?\K[^"]+')

          echo "Chart renders image: $RENDERED"
          [ "$RENDERED" = "$REPO:$VERSION" ] || {
            echo "::error::chart renders $RENDERED, expected $REPO:$VERSION"
            exit 1; }

          helm install hello chart/ \
            --set image.repository="$REPO" \
            --set image.tag="$VERSION" \
            --wait --wait-for-jobs --timeout 3m

          kubectl logs job/hello

      - name: Promote latest
        env:
          VERSION: ${{ steps.version.outputs.new }}
        run: |
          docker tag "$REPO:$VERSION" "$REPO:latest"
          docker push "$REPO:latest"

      - name: Job summary
        env:
          OLD: ${{ steps.version.outputs.old }}
          VERSION: ${{ steps.version.outputs.new }}
        run: |
          {
            echo "## Build $VERSION"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$OLD\` → \`$VERSION\` |"
            echo "| Image | \`$REPO:$VERSION\` |"
            echo "| Jar | \`myapp-$VERSION.jar\` |"
            echo "| Deployed | verified on kind |"
          } >> "$GITHUB_STEP_SUMMARY"

  tag:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag the release
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Job summary
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: echo "## Released \`v$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
