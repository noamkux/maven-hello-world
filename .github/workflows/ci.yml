name: CI

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-22.04

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: "17"
                  distribution: "temurin"
                  cache: maven

            - name: Determine next version
              id: version
              working-directory: myapp
              run: |
                  CURRENT=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
                  MAJOR=$(echo "$CURRENT" | cut -d. -f1)
                  MINOR=$(echo "$CURRENT" | cut -d. -f2)
                  PATCH=$(echo "$CURRENT" | cut -d. -f3)
                  NEW="$MAJOR.$MINOR.$((PATCH + 1))"
                  mvn -B versions:set -DnewVersion="$NEW" -DgenerateBackupPoms=false
                  echo "version=$NEW" >> "$GITHUB_OUTPUT"
                  echo "Bumped $CURRENT -> $NEW"

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  load: true
                  push: false
                  tags: |
                      ${{ vars.DOCKERHUB_USERNAME }}/maven-hello-world:${{ steps.version.outputs.version }}
                      ${{ vars.DOCKERHUB_USERNAME }}/maven-hello-world:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Smoke test
              run: |
                  IMAGE="${{ vars.DOCKERHUB_USERNAME }}/maven-hello-world:${{ steps.version.outputs.version }}"
                    
                  echo "--- entrypoint check ---"
                  docker run --rm "$IMAGE"

                  echo "--- non-root check ---"
                  RUN_UID=$(docker run --rm --entrypoint id "$IMAGE" -u)
                  echo "Running as UID: $RUN_UID"
                  [ "$RUN_UID" != "0" ] || {
                    echo "::error::container runs as root"; exit 1; }

            - name: Extract jar from image
              run: |
                  IMAGE="${{ vars.DOCKERHUB_USERNAME }}/maven-hello-world:${{ steps.version.outputs.version }}"
                  CID=$(docker create "$IMAGE")
                  docker cp "$CID:/app/app.jar" "./myapp-${{ steps.version.outputs.version }}.jar"
                  docker rm "$CID"
                  ls -lh ./myapp-*.jar

            - name: Upload jar artifact
              uses: actions/upload-artifact@v4
              with:
                  name: myapp-${{ steps.version.outputs.version }}
                  path: ./myapp-${{ steps.version.outputs.version }}.jar
                  if-no-files-found: error

            - name: Push to DockerHub
              run: |
                  docker push "${{ vars.DOCKERHUB_USERNAME }}/maven-hello-world:${{ steps.version.outputs.version }}"
                  docker push "${{ vars.DOCKERHUB_USERNAME }}/maven-hello-world:latest"

            - name: Pull from DockerHub
              run: |
                  IMAGE="${{ vars.DOCKERHUB_USERNAME }}/maven-hello-world:${{ steps.version.outputs.version }}"
                  docker rmi "$IMAGE" || true
                  docker pull "$IMAGE"
                  OUTPUT=$(docker run --rm "$IMAGE")
                  echo "$OUTPUT"

            - name: Commit and tag the release
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add myapp/pom.xml
                  git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
                  git tag "v${{ steps.version.outputs.version }}"
                  git push origin HEAD:main
                  git push origin "v${{ steps.version.outputs.version }}"
